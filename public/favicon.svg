<!--
  파비콘. 앱 아이콘과 같은 그림이어야 해서 구름은 glyphPaths.js의 CLOUD 실루엣을 그대로
  쓴다(48 좌표계라 group에서 축소해 얹는다). 색도 팔레트에서 뽑은 실제 값이다 —
  SVG 파일에서는 CSS 변수를 못 쓰므로 값이 박히는데, 팔레트를 바꾸면 여기도 같이 고쳐야 한다.
  ink #2c1b0f / sun #f5b100 / paper #fff6e9

  16px까지 줄어들어도 뭉개지지 않도록 해와 구름 둘만 남기고 광선은 위쪽 세 방향만 뒀다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#fff6e9" stroke="#2c1b0f" stroke-width="3"/>

  <g stroke="#2c1b0f" stroke-width="2" stroke-linecap="round">
    <line x1="12.5" y1="3.4" x2="12.5" y2="6.4"/>
    <line x1="5.4" y1="6.9" x2="7.6" y2="9.1"/>
    <line x1="3.8" y1="13.8" x2="6.8" y2="13.8"/>
  </g>
  <circle cx="12.6" cy="13.8" r="5.6" fill="#f5b100" stroke="#2c1b0f" stroke-width="2"/>

  <g transform="translate(9 14.2) scale(0.45)" fill="#ffffff" stroke="#2c1b0f" stroke-width="4.4" stroke-linejoin="round">
    <path d="M12.5 34.2 C7.6 34.2 4 30.4 4.2 25.7 C4.4 21.5 7.6 18.2 11.7 17.8 C12.6 12.2 17.4 8 23.2 8.2 C28.4 8.4 32.9 11.9 34.4 16.7 C35.2 16.3 36.2 16.1 37.2 16.2 C41.4 16.6 44.3 20.3 44 24.6 C43.7 29.9 39.3 34.4 34 34.2 Z"/>
  </g>
</svg>
